<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FinFlow"/>
<meta name="theme-color" content="#0A0A0A"/>
<meta name="description" content="FinFlow — personal finance tracker with on-device slip scanning. Data stays on your device."/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" href="icon.png"/>
<title>FinFlow</title>
<link rel="stylesheet" href="css/app.css"/>
<link rel="stylesheet" href="css/extra.css"/>
</head>
<body>
<div id="root">
  <div class="pages">

    <!-- ================= HOME ================= -->
    <div class="page active" id="page-home">
      <div class="status-spacer"></div>
      <div class="page-header split">
        <div>
          <p id="home-greeting" style="font-size:13px;color:var(--text2);margin-bottom:2px"></p>
          <h1>FinFlow</h1>
        </div>
        <div id="home-date" style="font-size:12px;color:var(--text3);text-align:right;line-height:1.4"></div>
      </div>

      <div id="home-banners"></div>

      <div class="home-hero">
        <div class="hero-glow"></div>
        <div class="hero-month">
          <div class="hero-month-label" id="hero-month-label"></div>
          <div class="month-nav">
            <button data-act="monthPrev" data-i18n-title="back" aria-label="prev">‹</button>
            <button data-act="monthNext" aria-label="next">›</button>
          </div>
        </div>
        <div class="hero-balance-label" data-i18n="balance"></div>
        <div class="hero-balance"><span>฿</span><span id="hero-balance">0</span></div>
        <div class="hero-sub" data-i18n="balance_sub"></div>
        <div class="hero-avail" id="hero-avail" hidden></div>
        <div class="hero-pills">
          <div class="hero-pill">
            <div class="hp-label"><div class="hp-dot green"></div><span data-i18n="income"></span></div>
            <div class="hp-amount green" id="hero-income">฿0</div>
          </div>
          <div class="hero-pill">
            <div class="hp-label"><div class="hp-dot red"></div><span data-i18n="expense"></span></div>
            <div class="hp-amount red" id="hero-expense">฿0</div>
          </div>
        </div>
        <div class="hero-budget" id="hero-budget-wrap" hidden>
          <div class="hero-budget-row">
            <span class="hero-budget-lbl" data-i18n="budget"></span>
            <span class="hero-budget-pct" id="hero-budget-pct">0%</span>
          </div>
          <div class="hero-budget-bar"><div class="hero-budget-fill" id="hero-budget-fill" style="width:0%"></div></div>
        </div>
        <div class="hero-insight" id="hero-insight"></div>
      </div>

      <div class="acct-chips" id="acct-chips" hidden></div>

      <div class="s-label" data-i18n="quick"></div>
      <div class="quick-grid">
        <div class="qa" data-go="add" role="button" tabindex="0">
          <div class="qa-circle green"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
          <span class="qa-label" data-i18n="q_add"></span>
        </div>
        <div class="qa" data-go="scan" role="button" tabindex="0">
          <div class="qa-circle blue"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
          <span class="qa-label" data-i18n="q_scan"></span>
        </div>
        <div class="qa" data-go="goals" role="button" tabindex="0">
          <div class="qa-circle amber"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
          <span class="qa-label" data-i18n="q_goals"></span>
        </div>
        <div class="qa" data-go="analytics" role="button" tabindex="0">
          <div class="qa-circle purple"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
          <span class="qa-label" data-i18n="q_analytics"></span>
        </div>
        <div class="qa" data-go="settings" role="button" tabindex="0">
          <div class="qa-circle" style="background:var(--bg4)"><svg viewBox="0 0 24 24" style="stroke:var(--text2)"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
          <span class="qa-label" data-i18n="q_settings"></span>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:10px;margin-top:24px">
        <span class="s-label" style="padding:0;margin:0" data-i18n="recent"></span>
        <button data-go="all" style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green);background:none;border:none;cursor:pointer;font-weight:700">
          <span data-i18n="see_all"></span><span class="tx-count-badge" id="tx-total-count" style="background:var(--green-dim);color:var(--green)"></span>
        </button>
      </div>
      <div class="tx-list" id="home-tx-list"></div>
    </div>

    <!-- ================= ADD ================= -->
    <div class="page" id="page-add">
      <div class="status-spacer"></div>
      <div class="page-header">
        <h1 data-i18n="add_title"></h1>
        <p data-i18n="add_sub"></p>
      </div>
      <form class="add-wrap" id="add-form" autocomplete="off" novalidate>
        <div class="type-toggle three" id="add-type" role="group">
          <button type="button" class="type-btn income-t" data-act="addType" data-arg="income" data-i18n="t_income"></button>
          <button type="button" class="type-btn expense-t active" data-act="addType" data-arg="expense" data-i18n="t_expense"></button>
          <button type="button" class="type-btn transfer-t" data-act="addType" data-arg="transfer" data-i18n="t_transfer"></button>
        </div>
        <div class="quick-chips" id="add-quick" hidden></div>
        <div class="field">
          <label class="field-label" for="f-amount" data-i18n="amount"></label>
          <div class="amount-prefix"><input class="amount-field" type="text" id="f-amount" inputmode="decimal" placeholder="0.00" maxlength="12"/></div>
        </div>
        <div class="field">
          <label class="field-label" for="f-name" data-i18n="description"></label>
          <input type="text" id="f-name" list="dl-names" maxlength="120" data-i18n-ph="ph_desc"/>
          <datalist id="dl-names"></datalist>
        </div>
        <div class="field" id="f-cat-wrap">
          <label class="field-label" for="f-cat" data-i18n="category"></label>
          <div class="select-arrow"><select id="f-cat"></select></div>
        </div>
        <div class="field" id="f-acct-wrap" hidden>
          <label class="field-label" for="f-acct" id="f-acct-lbl" data-i18n="account"></label>
          <div class="select-arrow"><select id="f-acct"></select></div>
        </div>
        <div class="field" id="f-acct2-wrap" hidden>
          <label class="field-label" for="f-acct2" data-i18n="to_acct"></label>
          <div class="select-arrow"><select id="f-acct2"></select></div>
        </div>
        <div class="sc-grid">
          <div class="field"><label class="field-label" for="f-date" data-i18n="date"></label><input type="date" id="f-date"/></div>
          <div class="field"><label class="field-label" for="f-time" data-i18n="time"></label><input type="time" id="f-time"/></div>
        </div>
        <div class="field">
          <label class="field-label" for="f-note" data-i18n="note"></label>
          <input type="text" id="f-note" maxlength="200" data-i18n-ph="ph_note"/>
        </div>
        <button class="submit-btn" type="submit" id="f-save" data-i18n="save_tx"></button>
      </form>
    </div>

    <!-- ================= SCAN ================= -->
    <div class="page" id="page-scan">
      <div class="status-spacer"></div>
      <div class="page-header">
        <h1 data-i18n="scan_title"></h1>
        <p data-i18n="scan_sub"></p>
      </div>
      <div class="scan-wrap">
        <div class="upload-zone" id="upload-zone">
          <input type="file" accept="image/*" multiple id="slip-input" aria-label="slip"/>
          <div class="upload-icon">📷</div>
          <div class="upload-title" data-i18n="upload_title"></div>
          <div class="upload-sub" data-i18n="upload_sub"></div>
        </div>
        <div id="scan-status" hidden>
          <div class="ocr-status"><div class="ocr-spinner"></div><span class="ocr-text" id="scan-status-text"></span></div>
          <div class="scan-progress"><div id="scan-progress-bar"></div></div>
        </div>
        <div id="scan-queue"></div>
        <button class="confirm-btn" id="scan-save-all" data-act="scanSaveAll" hidden></button>
        <div class="scan-tips" id="scan-tips">
          <div class="s-label" style="padding:0" data-i18n="tips"></div>
          <div style="background:var(--card);border-radius:var(--r-lg);border:0.5px solid var(--border);overflow:hidden">
            <div class="tip"><span>✅</span><span data-i18n="scan_tip1"></span></div>
            <div class="tip"><span>🧠</span><span data-i18n="scan_tip2"></span></div>
            <div class="tip"><span>👀</span><span data-i18n="scan_tip3"></span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= ANALYTICS ================= -->
    <div class="page" id="page-analytics">
      <div class="status-spacer"></div>
      <div class="page-header split">
        <div><h1 data-i18n="an_title"></h1><p data-i18n="an_sub"></p></div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="small-btn" data-act="monthPrev" aria-label="prev">‹</button>
          <span style="font-size:11px;color:var(--text2);min-width:62px;text-align:center" id="analytics-month"></span>
          <button class="small-btn" data-act="monthNext" aria-label="next">›</button>
        </div>
      </div>
      <div class="analytics-wrap">
        <div id="an-alerts"></div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-box-label" data-i18n="total_spent"></div><div class="stat-box-val red" id="an-expense">฿0</div><div class="stat-sub" id="an-expense-sub" hidden></div></div>
          <div class="stat-box"><div class="stat-box-label" id="an-vs-label" data-i18n="vs_last"></div><div class="stat-box-val" id="an-vs">—</div><div class="stat-sub" id="an-vs-sub" hidden></div></div>
        </div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-box-label" data-i18n="savings_rate"></div><div class="stat-box-val" id="an-savings-rate">—</div></div>
          <div class="stat-box"><div class="stat-box-label" data-i18n="avg_day"></div><div class="stat-box-val" id="an-avg-daily">—</div></div>
        </div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-box-label" data-i18n="biggest"></div><div class="stat-box-val red" id="an-biggest">—</div></div>
          <div class="stat-box"><div class="stat-box-label" data-i18n="tx_count"></div><div class="stat-box-val" id="an-tx-count">—</div></div>
        </div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-box-label" data-i18n="all_net"></div><div class="stat-box-val" id="an-net-worth">—</div></div>
          <div class="stat-box"><div class="stat-box-label" data-i18n="all_records"></div><div class="stat-box-val" id="an-all-count">—</div></div>
        </div>
        <div class="chart-card" id="forecast-card" hidden>
          <div class="chart-title" data-i18n="fc_title"></div>
          <div class="chart-subtitle" data-i18n="fc_sub"></div>
          <div id="forecast-body"></div>
        </div>
        <div class="chart-card" id="budget-card" hidden>
          <div class="chart-title" data-i18n="budget_card"></div>
          <div class="chart-subtitle" data-i18n="budget_card_sub"></div>
          <div id="budget-progress-content"></div>
          <div id="cat-budget-content" style="margin-top:14px"></div>
        </div>
        <div class="chart-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;gap:8px">
            <div><div class="chart-title" data-i18n="c_donut"></div><div class="chart-subtitle" data-i18n="c_donut_sub"></div></div>
            <div class="seg" id="cat-seg"><button data-act="catBarType" data-arg="expense" class="active" data-i18n="out"></button><button data-act="catBarType" data-arg="income" data-i18n="in"></button></div>
          </div>
          <div class="donut-wrap">
            <svg class="donut-svg" width="110" height="110" viewBox="0 0 110 110" id="donut-svg" role="img"></svg>
            <div class="donut-legend" id="donut-legend"></div>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title" data-i18n="c_bar"></div>
          <div class="chart-subtitle" data-i18n="c_bar_sub"></div>
          <div class="bar-chart" id="bar-chart"></div>
          <div class="pick-info" id="bar-info" data-i18n="tap_hint"></div>
        </div>
        <div class="chart-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div class="chart-title" data-i18n="c_line"></div><div class="chart-subtitle" data-i18n="c_line_sub"></div></div>
            <div class="chart-legend"><span><i style="background:var(--green)"></i><b data-i18n="income"></b></span><span><i style="background:var(--red)"></i><b data-i18n="expense"></b></span></div></div>
          <svg class="line-svg" id="line-svg" height="90"></svg>
        </div>
        <div class="chart-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div class="chart-title" data-i18n="c_nw"></div><div class="chart-subtitle" data-i18n="c_nw_sub"></div></div><div class="chart-val" id="nw-now"></div></div>
          <svg style="width:100%;overflow:visible" id="nw-svg" height="60"></svg>
          <div class="nw-trend-labels" id="nw-trend-labels"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title" data-i18n="c_heat"></div>
          <div class="chart-subtitle" data-i18n="c_heat_sub"></div>
          <div class="heatmap-grid" id="heatmap"></div>
          <div class="pick-info" id="hm-info" data-i18n="tap_hint"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title" data-i18n="c_weekday"></div>
          <div class="chart-subtitle" data-i18n="c_weekday_sub"></div>
          <div class="bar-chart" id="weekday-chart"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title" data-i18n="c_top"></div>
          <div class="chart-subtitle" data-i18n="c_top_sub"></div>
          <div id="cat-bars"></div>
        </div>
        <div class="chart-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;gap:8px">
            <div><div class="chart-title" data-i18n="c_labels"></div><div class="chart-subtitle" data-i18n="c_labels_sub"></div></div>
            <div class="seg" id="lbl-seg"><button data-act="lblMode" data-arg="amount" class="active" data-i18n="lbl_top_amount"></button><button data-act="lblMode" data-arg="count" data-i18n="lbl_top_count"></button></div>
          </div>
          <div id="label-list"></div>
        </div>
        <button class="btn-ghost" data-go="report" data-i18n="open_report"></button>
      </div>
    </div>
    <!-- ================= SETTINGS ================= -->
    <div class="page" id="page-settings">
      <div class="status-spacer"></div>
      <div class="page-header"><h1 data-i18n="set_title"></h1><p data-i18n="set_sub"></p></div>
      <div class="settings-wrap">
        <div class="s-label" style="padding:0" data-i18n="s_language"></div>
        <div class="settings-group"><div class="lang-opts">
          <div class="lang-opt" id="lang-th" data-act="setLang" data-arg="th" role="button" tabindex="0"><span class="lang-opt-flag">🇹🇭</span><div class="lang-opt-name">ภาษาไทย</div><div class="lang-opt-sub">Thai</div></div>
          <div class="lang-opt" id="lang-en" data-act="setLang" data-arg="en" role="button" tabindex="0"><span class="lang-opt-flag">🇬🇧</span><div class="lang-opt-name">English</div><div class="lang-opt-sub">English</div></div>
        </div></div>

        <div class="s-label" style="padding:0" data-i18n="s_appearance"></div>
        <div class="settings-group"><div class="settings-row">
          <div class="settings-left"><div class="settings-icon amber" id="theme-icon">🌙</div><div class="settings-text"><div class="settings-title" data-i18n="dark_mode"></div><div class="settings-sub" data-i18n="dark_mode_sub"></div></div></div>
          <button class="toggle-switch on" id="theme-toggle" data-act="toggleTheme" role="switch" aria-label="dark mode"></button>
        </div></div>

        <div class="s-label" style="padding:0" data-i18n="s_security"></div>
        <div class="settings-group">
          <div class="settings-row"><div class="settings-left"><div class="settings-icon red">🔐</div><div class="settings-text"><div class="settings-title" data-i18n="pin_lock"></div><div class="settings-sub" data-i18n="pin_lock_sub"></div></div></div>
            <button class="toggle-switch" id="pin-toggle" data-act="togglePin" role="switch" aria-label="PIN"></button></div>
          <div class="settings-row" id="autolock-row" hidden><div class="settings-left"><div class="settings-icon amber">⏱️</div><div class="settings-text"><div class="settings-title" data-i18n="pin_autolock"></div><div class="settings-sub" data-i18n="pin_autolock_sub"></div></div></div>
            <button class="toggle-switch on" id="autolock-toggle" data-act="toggleAutolock" role="switch" aria-label="auto-lock"></button></div>
        </div>

        <div class="s-label" style="padding:0" data-i18n="s_budget"></div>
        <div class="settings-group">
          <div style="padding:14px 16px;border-bottom:0.5px solid var(--border)">
            <div class="settings-left" style="margin-bottom:10px"><div class="settings-icon green">🎯</div><div class="settings-text"><div class="settings-title" data-i18n="budget_total"></div><div class="settings-sub" data-i18n="budget_total_sub"></div></div></div>
            <div style="display:flex;gap:8px;align-items:center">
              <div class="amount-prefix" style="flex:1"><input type="text" id="budget-input" placeholder="0" inputmode="decimal" style="width:100%;font-size:16px;padding:10px 12px 10px 36px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:inherit"/></div>
              <button class="small-btn primary" style="padding:11px 18px" data-act="saveBudget" data-i18n="save"></button>
            </div>
          </div>
          <div class="settings-row" data-go="budgets" style="cursor:pointer"><div class="settings-left"><div class="settings-icon purple">📊</div><div class="settings-text"><div class="settings-title" data-i18n="budget_by_cat"></div><div class="settings-sub" data-i18n="budget_by_cat_sub"></div></div></div><span class="chev">›</span></div>
          <div class="settings-row"><div class="settings-left"><div class="settings-icon amber">🔔</div><div class="settings-text"><div class="settings-title" data-i18n="notif"></div><div class="settings-sub" data-i18n="notif_sub"></div></div></div>
            <button class="toggle-switch" id="notif-toggle" data-act="toggleNotif" role="switch" aria-label="notifications"></button></div>
        </div>

        <div class="s-label" style="padding:0" data-i18n="s_money"></div>
        <div class="settings-group">
          <div class="settings-row" data-go="accounts" style="cursor:pointer"><div class="settings-left"><div class="settings-icon green">🏦</div><div class="settings-text"><div class="settings-title" data-i18n="accounts"></div><div class="settings-sub" data-i18n="accounts_sub"></div></div></div><span class="chev">›</span></div>
          <div class="settings-row" data-go="recurring" style="cursor:pointer"><div class="settings-left"><div class="settings-icon blue">🔄</div><div class="settings-text"><div class="settings-title" data-i18n="recurring"></div><div class="settings-sub" data-i18n="recurring_sub"></div></div></div><span class="chev">›</span></div>
          <div class="settings-row" data-go="categories" style="cursor:pointer"><div class="settings-left"><div class="settings-icon green">🏷️</div><div class="settings-text"><div class="settings-title" data-i18n="categories"></div><div class="settings-sub" data-i18n="categories_sub"></div></div></div><span class="chev">›</span></div>
          <div class="settings-row" data-go="goals" style="cursor:pointer"><div class="settings-left"><div class="settings-icon amber">🎯</div><div class="settings-text"><div class="settings-title" data-i18n="goals"></div><div class="settings-sub" data-i18n="goals_sub"></div></div></div><span class="chev">›</span></div>
          <div class="settings-row" data-go="report" style="cursor:pointer"><div class="settings-left"><div class="settings-icon purple">🧾</div><div class="settings-text"><div class="settings-title" data-i18n="report_title"></div><div class="settings-sub" data-i18n="report_sub"></div></div></div><span class="chev">›</span></div>
        </div>

  <div style="font-size:48px">🔐</div>
  <div class="pin-title">FinFlow</div>
  <div class="pin-sub" id="pin-prompt"></div>
  <div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
  <div class="pin-keypad">
    <button class="pin-key" data-pin="1">1</button><button class="pin-key" data-pin="2">2</button><button class="pin-key" data-pin="3">3</button>
    <button class="pin-key" data-pin="4">4</button><button class="pin-key" data-pin="5">5</button><button class="pin-key" data-pin="6">6</button>
    <button class="pin-key" data-pin="7">7</button><button class="pin-key" data-pin="8">8</button><button class="pin-key" data-pin="9">9</button>
    <div class="pin-key empty"></div><button class="pin-key" data-pin="0">0</button><button class="pin-key del" data-pin="del" aria-label="delete">⌫</button>
  </div>
  <button class="pin-cancel" id="pin-cancel" hidden data-act="pinCancel"></button>
</div>

<!-- TOAST -->
<div class="sel-bar" id="sel-bar" hidden><span id="sel-count"></span><button class="small-btn" data-act="selAll" data-i18n="sel_all"></button><button class="small-btn" data-act="selCat" data-i18n="sel_cat"></button><button class="small-btn danger" data-act="selDelete" data-i18n="sel_del"></button><button class="small-btn primary" data-act="selToggle" data-i18n="sel_done"></button></div>

<div class="modal-overlay" id="sheet-bulkcat" data-overlay><div class="modal" role="dialog" aria-modal="true"><div class="modal-handle"></div><div class="modal-title" id="bulkcat-title"></div><div class="select-arrow"><select id="bulkcat-sel"></select></div><div class="modal-actions"><button class="btn-cancel" data-act="closeSheet" data-i18n="cancel"></button><button class="btn-save" data-act="bulkCatSave" data-i18n="save"></button></div></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-icon" id="toast-icon"></span><span class="toast-msg" id="toast-msg"></span><button class="toast-action" id="toast-action" hidden></button></div>

<script src="js/version.js"></script>
<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/imgproc.js"></script>
<script src="js/slip.js"></script>
<script src="js/learn.js"></script>
<script src="js/ocr.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages-tx.js"></script>
<script src="js/pages-scan.js"></script>
<script src="js/pages-analytics.js"></script>
<script src="js/pages-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
